<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark & Mysterious | TRUE POSITIVE</title>

    <link rel="icon" type="image/jpeg" href="assets/icons/true-positive-logo.png">
    <link rel="shortcut icon" href="assets/icons/true-positive-logo.png" type="image/jpeg">
    <link rel="apple-touch-icon" href="assets/icons/true-positive-logo.png">

    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        :root {
            --color-bg: #0A0A0A;
            --color-card: #111111;
            --color-text: #F5F5F5;
            --color-accent: #B30000;
            --color-accent-hover: #ff0033;
        }

        body {
            background-color: var(--color-bg);
            color: var(--color-text);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        h1, h2, h3, h4, .font-cinzel {
            font-family: 'Cinzel', serif;
        }

        /* Film Grain Overlay */
        .film-grain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
            opacity: 0.05;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #000;
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--color-accent);
        }

        /* Fade Animation */
        .fade-in-section {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
            will-change: opacity, visibility;
        }
        .fade-in-section.is-visible {
            opacity: 1;
            transform: none;
        }

        /* Glitch Effect on Hover for special titles */
        .glitch-hover:hover {
            animation: glitch 0.3s cubic-bezier(.25, .46, .45, .94) both infinite;
            color: #B30000;
        }
        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 2px) }
            40% { transform: translate(-2px, -2px) }
            60% { transform: translate(2px, 2px) }
            80% { transform: translate(2px, -2px) }
            100% { transform: translate(0) }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        /* --- ICONS (SVG Components) --- */
        const Icon = ({ path, size = 24, className = "" }) => (
            <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width={size} 
                height={size} 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor" 
                strokeWidth="2" 
                strokeLinecap="round" 
                strokeLinejoin="round" 
                className={className}
            >
                {path}
            </svg>
        );

        /* FIXED: Added React Fragments <>...</> around multi-element icons */
        const Icons = {
            Play: (props) => <Icon {...props} path={<polygon points="5 3 19 12 5 21 5 3"></polygon>} />,
            Menu: (props) => <Icon {...props} path={<><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="18" x2="20" y2="18"></line></>} />,
            X: (props) => <Icon {...props} path={<><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></>} />,
            ArrowRight: (props) => <Icon {...props} path={<><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></>} />,
            Youtube: (props) => <Icon {...props} path={<><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z"></path><polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"></polygon></>} />,
            Instagram: (props) => <Icon {...props} path={<><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></>} />,
            Facebook: (props) => <Icon {...props} path={<path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path>} />,
            Mail: (props) => <Icon {...props} path={<><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></>} />,
            Skull: (props) => <Icon {...props} path={<path d="M12.4 2.1c2.3 0 4.2 1.8 4.6 4.1.3 2.1-1.3 4.1-3.4 4.1-1.3 0-2.4-.6-3.1-1.6-.7 1-1.8 1.6-3.1 1.6-2.1 0-3.7-2-3.4-4.1.4-2.3 2.3-4.1 4.6-4.1 1.3 0 2.5.6 3.2 1.5.7-.9 1.9-1.5 3.2-1.5z"></path>} />
        };

        /* --- HOOKS --- */
        const useIntersectionObserver = () => {
            useEffect(() => {
                const observer = new IntersectionObserver(
                    (entries) => {
                        entries.forEach((entry) => {
                            if (entry.isIntersecting) {
                                entry.target.classList.add('is-visible');
                            }
                        });
                    },
                    { threshold: 0.1 }
                );

                document.querySelectorAll('.fade-in-section').forEach((el) => {
                    observer.observe(el);
                });

                return () => observer.disconnect();
            }, []);
        };

        /* --- COMPONENTS --- */
        const Button = ({ children, variant = 'primary', className = '', icon: IconComponent, href = '#' }) => {
            const baseStyle = "inline-flex items-center justify-center px-6 py-3 font-cinzel font-bold tracking-widest transition-all duration-300 uppercase text-sm border";
            const variants = {
                primary: "bg-[#B30000] border-[#B30000] text-white hover:bg-[#ff0033] hover:border-[#ff0033] hover:shadow-[0_0_15px_rgba(179,0,0,0.5)]",
                outline: "bg-transparent border-white text-white hover:bg-white hover:text-black",
                ghost: "border-transparent text-gray-300 hover:text-[#B30000]"
            };

            return (
                <a href={href} className={`${baseStyle} ${variants[variant]} ${className}`}>
                    {IconComponent && <IconComponent size={16} className="mr-2" />}
                    {children}
                </a>
            );
        };

        const Navbar = () => {
            const [isOpen, setIsOpen] = useState(false);
            const [scrolled, setScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const navLinks = [
                { name: 'Home', href: 'index.html' },
                { name: 'Episodes', href: '#episodes' },
                { name: 'Categories', href: 'index.html#categories' },
                { name: 'About', href: '#about' },
            ];

            return (
                <nav className={`fixed w-full z-50 transition-all duration-500 ${scrolled ? 'bg-black/90 backdrop-blur-md py-4 border-b border-gray-900' : 'bg-transparent py-6'}`}>
                    <div className="container mx-auto px-6 flex justify-between items-center">
                        <a href="index.html" className="text-2xl font-cinzel font-bold tracking-widest text-white flex items-center gap-2">
                            <span className="text-[#B30000]">TRUE</span> POSITIVE
                        </a>

                        <div className="hidden md:flex items-center space-x-8">
                            {navLinks.map((link) => (
                                <a key={link.name} href={link.href} className="text-sm font-medium tracking-wide text-gray-300 hover:text-[#B30000] transition-colors uppercase">
                                    {link.name}
                                </a>
                            ))}
                            <Button variant="primary" className="!py-2 !px-4 !text-xs">Subscribe</Button>
                        </div>

                        <button onClick={() => setIsOpen(!isOpen)} className="md:hidden text-white hover:text-[#B30000]">
                            {isOpen ? <Icons.X size={28} /> : <Icons.Menu size={28} />}
                        </button>
                    </div>

                    <div className={`fixed inset-0 bg-black/95 z-40 flex flex-col items-center justify-center space-y-8 transition-transform duration-500 ${isOpen ? 'translate-x-0' : 'translate-x-full'}`}>
                        {navLinks.map((link) => (
                            <a key={link.name} href={link.href} onClick={() => setIsOpen(false)} className="text-2xl font-cinzel text-white hover:text-[#B30000]">
                                {link.name}
                            </a>
                        ))}
                        <button onClick={() => setIsOpen(false)} className="absolute top-6 right-6 text-white"><Icons.X size={32}/></button>
                    </div>
                </nav>
            );
        };

        const Hero = () => {
            return (
                <section className="relative h-[80vh] flex items-center justify-center overflow-hidden">
                    <div className="absolute inset-0 z-0">
                        <img 
                            src="https://images.unsplash.com/photo-1518175510619-216d2f357f83?q=80&w=2000&auto=format&fit=crop" 
                            alt="Misty Forest" 
                            className="w-full h-full object-cover opacity-50 grayscale hover:grayscale-0 transition-all duration-[3s]"
                        />
                        <div className="absolute inset-0 bg-gradient-to-b from-[#0A0A0A] via-transparent to-[#0A0A0A]"></div>
                        <div className="absolute inset-0 bg-black/40"></div>
                    </div>

                    <div className="relative z-10 text-center max-w-4xl px-6 fade-in-section mt-20">
                        <div className="inline-flex items-center gap-2 mb-4 px-3 py-1 border border-[#B30000] text-[#B30000] text-xs font-bold tracking-[0.2em] uppercase bg-black/50 backdrop-blur-sm">
                            <Icons.Skull size={14} /> Category Focus
                        </div>
                        <h1 className="text-5xl md:text-7xl font-bold mb-4 leading-tight text-white drop-shadow-lg font-cinzel glitch-hover cursor-default">
                            DARK & <br/><span className="text-[#B30000]">MYSTERIOUS</span>
                        </h1>
                        <p className="text-lg md:text-xl text-gray-300 mb-8 max-w-2xl mx-auto font-light leading-relaxed">
                            Unsolved disappearances, unexplainable phenomena, and cases where the evidence simply doesn't add up. Welcome to the unknown.
                        </p>
                    </div>
                </section>
            );
        };

        const EpisodeGrid = () => {
            const episodes = [
                { 
                    id: 1, 
                    title: "The Dyatlov Pass", 
                    desc: "Nine hikers died in the Ural Mountains under mysterious circumstances. What forced them out into the cold?", 
                    img: "https://images.unsplash.com/photo-1518558356391-72e7a9b89326?q=80&w=1000&auto=format&fit=crop",
                    date: "1959",
                    duration: "58 min"
                },
                { 
                    id: 2, 
                    title: "The Watcher", 
                    desc: "A family bought their dream home in New Jersey, only to be terrorized by a stalker who knew too much.", 
                    img: "https://images.unsplash.com/photo-1505506874110-6a7a69069a08?q=80&w=1000&auto=format&fit=crop",
                    date: "2014",
                    duration: "45 min"
                },
                { 
                    id: 3, 
                    title: "Elisa Lam", 
                    desc: "The disturbing elevator footage from the Cecil Hotel that captured the world's attention before a tragic discovery.", 
                    img: "https://images.unsplash.com/photo-1572579893963-c35ba3cb8501?q=80&w=1000&auto=format&fit=crop",
                    date: "2013",
                    duration: "40 min"
                },
                { 
                    id: 4, 
                    title: "Cicada 3301", 
                    desc: "The internet's most baffling puzzle. Was it a recruitment tool for the NSA, a cult, or something else?", 
                    img: "https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?q=80&w=1000&auto=format&fit=crop",
                    date: "2012",
                    duration: "52 min"
                },
                { 
                    id: 5, 
                    title: "Mary Celeste", 
                    desc: "Found adrift in the Atlantic Ocean, completely seaworthy, with the crew missing and cargo untouched.", 
                    img: "https://images.unsplash.com/photo-1500043236063-448d3c26cb72?q=80&w=1000&auto=format&fit=crop",
                    date: "1872",
                    duration: "35 min"
                },
                { 
                    id: 6, 
                    title: "Villisca Axe Murders", 
                    desc: "An entire family and two guests were murdered in their sleep. Over 100 years later, the killer remains unknown.", 
                    img: "https://images.unsplash.com/photo-1509248961158-e54f6934749c?q=80&w=1000&auto=format&fit=crop",
                    date: "1912",
                    duration: "60 min"
                }
            ];

            return (
                <section id="episodes" className="py-20 bg-[#111111]">
                    <div className="container mx-auto px-6">
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                            {episodes.map((ep) => (
                                <div key={ep.id} className="group bg-[#0A0A0A] border border-gray-800 hover:border-[#B30000] transition-all duration-300 fade-in-section flex flex-col h-full cursor-pointer">
                                    <div className="relative h-56 overflow-hidden">
                                        <img src={ep.img} alt={ep.title} className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110 grayscale group-hover:grayscale-0" />
                                        <div className="absolute top-4 right-4 bg-[#B30000] px-2 py-1 text-xs text-white font-bold tracking-widest">{ep.date}</div>
                                        <div className="absolute bottom-4 right-4 bg-black/80 px-2 py-1 text-xs text-white font-mono">{ep.duration}</div>
                                        
                                        <div className="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300 bg-black/40">
                                            <div className="bg-[#B30000] p-4 rounded-full shadow-lg transform hover:scale-110 transition-transform">
                                                <Icons.Play size={24} className="ml-1 text-white" />
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div className="p-6 flex flex-col flex-grow relative overflow-hidden">
                                        <h3 className="text-xl font-cinzel font-bold text-white mb-2 group-hover:text-[#B30000] transition-colors">{ep.title}</h3>
                                        <p className="text-gray-400 text-sm leading-relaxed mb-6 flex-grow border-l-2 border-gray-800 pl-3 group-hover:border-[#B30000] transition-colors">
                                            {ep.desc}
                                        </p>
                                        <div className="mt-auto flex justify-between items-center text-xs text-gray-500 font-mono uppercase tracking-widest">
                                            <span>Case File #{100 + ep.id}</span>
                                            <span className="group-hover:text-white transition-colors">Watch Now &rarr;</span>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const TheorySection = () => {
            return (
                 <section className="py-20 bg-[#0A0A0A] border-y border-gray-900">
                    <div className="container mx-auto px-6 text-center fade-in-section">
                        <Icons.Skull size={48} className="mx-auto text-[#B30000] mb-6 animate-pulse" />
                        <h2 className="text-3xl font-cinzel text-white mb-4">Have a Theory?</h2>
                        <p className="text-gray-400 max-w-lg mx-auto mb-8">
                            These cases remain open. If you have information or a theory about any of the incidents listed above, submit it to our research team.
                        </p>
                        <Button variant="outline">Submit Evidence</Button>
                    </div>
                 </section>
            );
        }

        const Footer = () => {
            return (
                <footer id="footer" className="bg-[#050505] text-white pt-20 pb-10 border-t border-[#111]">
                    <div className="container mx-auto px-6">
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-12 mb-16 fade-in-section">
                            <div className="col-span-1 md:col-span-2">
                                <a href="#" className="text-3xl font-cinzel font-bold tracking-widest text-white mb-6 block">
                                <span className="text-[#B30000]">TRUE</span> POSITIVE
                                </a>
                                <p className="text-gray-400 max-w-sm mb-6 leading-relaxed">
                                Real Stories. Dark Truths. Human Reality.
                                </p>
                                <div className="flex gap-4">
                                    <a href="#" className="w-10 h-10 border border-gray-700 flex items-center justify-center hover:bg-[#B30000] hover:border-[#B30000] transition-all"><Icons.Youtube size={18}/></a>
                                    <a href="#" className="w-10 h-10 border border-gray-700 flex items-center justify-center hover:bg-[#B30000] hover:border-[#B30000] transition-all"><Icons.Instagram size={18}/></a>
                                    <a href="#" className="w-10 h-10 border border-gray-700 flex items-center justify-center hover:bg-[#B30000] hover:border-[#B30000] transition-all"><Icons.Facebook size={18}/></a>
                                </div>
                            </div>
                            
                            <div>
                                <h4 className="text-lg font-bold mb-6 font-cinzel">Quick Links</h4>
                                <ul className="space-y-3 text-gray-400">
                                <li><a href="index.html" className="hover:text-[#B30000] transition-colors">Home</a></li>
                                <li><a href="#" className="hover:text-[#B30000] transition-colors">All Categories</a></li>
                                <li><a href="#" className="hover:text-[#B30000] transition-colors">Submit Case</a></li>
                                </ul>
                            </div>
                            
                            <div>
                                <h4 className="text-lg font-bold mb-6 font-cinzel">Contact</h4>
                                <ul className="space-y-3 text-gray-400">
                                <li className="flex items-center gap-2"><Icons.Mail size={16} /> stories@truepositive.com</li>
                                </ul>
                            </div>
                        </div>
                        
                        <div className="border-t border-gray-900 pt-8 text-center text-xs text-gray-600">
                            <p>&copy; {new Date().getFullYear()} True Positive. Powered by Jaiho AI Media</p>
                        </div>
                    </div>
                </footer>
            );
        };

        const App = () => {
            useIntersectionObserver();

            return (
                <div className="min-h-screen">
                    <div className="film-grain"></div>
                    <Navbar />
                    <main>
                        <Hero />
                        <EpisodeGrid />
                        <TheorySection />
                    </main>
                    <Footer />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
